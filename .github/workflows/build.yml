name: Multi-Platform Build (STM32, Windows & Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Сборка прошивок для микроконтроллеров STM32
  build-and-pack:
    strategy:
      matrix:
        include:
          - preset: "stm32f401xc-debug"
            os: ubuntu-latest
          - preset: "stm32f411xe-debug"
            os: ubuntu-latest
          - preset: "win-debug"
            os: windows-latest
          - preset: "win-release"
            os: windows-latest
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build

    - name: Install Arm GNU Toolchain (Linux)
      if: runner.os == 'Linux'
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja

    - name: Set up MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }}

    - name: Install and Organize SDK
      run: cmake --install build/${{ matrix.preset }} --prefix dist/${{ matrix.preset }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LetoOS-${{ matrix.preset }}
        path: dist/${{ matrix.preset }}/
        if-no-files-found: error

  # 2. Сборка под Linux: проверяет ветку загрузчика на dlopen, которую
  #    STM32 и Windows не компилируют вовсе
  build-linux:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout LetoAPI
      uses: actions/checkout@v4
      with:
        repository: leto-console/LetoAPI
        path: leto/LetoAPI

    - name: Checkout LetoCore
      uses: actions/checkout@v4
      with:
        repository: leto-console/LetoCore
        path: leto/LetoCore

    - name: Checkout LetoOS
      uses: actions/checkout@v4
      with:
        path: leto/LetoOS

    - name: Install Dependencies (Linux)
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libsdl2-dev

    - name: Configure and build
      env:
        LETO_PATH: ${{ github.workspace }}/leto/
      run: |
        set -e
        for repo in LetoAPI LetoCore LetoOS; do
          (cd "leto/$repo" && cmake --preset linux-debug && cmake --build --preset linux-debug)
        done

    - name: Test
      env:
        LETO_PATH: ${{ github.workspace }}/leto/
      run: ctest --test-dir leto/LetoOS/build/linux-debug --output-on-failure

  ci-result:
    name: CI Result
    if: always()
    needs: [build-and-pack, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix jobs status
        run: |
          # Проверяем, что все джобы из needs завершились со статусом success
          if [[ "${{ needs.build-and-pack.result }}" != "success" ]] || \
             [[ "${{ needs.build-linux.result }}" != "success" ]]; then
            echo "❌ Один или несколько джобов матрицы завершились с ошибкой."
            exit 1
          fi
          echo "✅ Все сборки и тесты успешно пройдены."
