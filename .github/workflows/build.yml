name: Multi-Platform Build (STM32, Windows & Linux)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Сборка прошивок для микроконтроллеров STM32
  build-and-pack:
    strategy:
      matrix:
        include:
          - preset: "stm32f401xc-debug"
            os: ubuntu-latest
            test: false
          - preset: "stm32f411xe-debug"
            os: ubuntu-latest
            test: false
          - preset: "win-debug"
            os: windows-latest
            test: false
          - preset: "win-release"
            os: windows-latest
            test: false
          - preset: "linux-debug"
            os: ubuntu-latest
            test: true
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ninja-build libsdl2-dev

    - name: Install Arm GNU Toolchain (Linux)
      if: startsWith(matrix.preset, 'stm32')
      uses: carlosperate/arm-none-eabi-gcc-action@v1
      with:
        release: '14.2.Rel1'

    - name: Install Dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ninja

    - name: Set up MSVC Developer Command Prompt (Windows)
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure CMake
      run: cmake --preset ${{ matrix.preset }}

    - name: Build Firmware
      run: cmake --build --preset ${{ matrix.preset }}

    # Сборка идёт без LETO_PATH: зависимости приходят через FetchContent из
    # LetoCore и LetoAPI. Тесты есть только у не-STM32 пресетов.
    - name: Run Tests
      if: matrix.test
      run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

    - name: Install and Organize SDK
      run: cmake --install build/${{ matrix.preset }} --prefix dist/${{ matrix.preset }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LetoOS-${{ matrix.preset }}
        path: dist/${{ matrix.preset }}/
        if-no-files-found: error

  ci-result:
    name: CI Result
    if: always()
    needs: [build-and-pack]
    runs-on: ubuntu-latest
    steps:
      - name: Check all matrix jobs status
        run: |
          # Проверяем, что все джобы из needs завершились со статусом success
          if [[ "${{ needs.build-and-pack.result }}" != "success" ]]; then
            echo "❌ Один или несколько джобов матрицы завершились с ошибкой."
            exit 1
          fi
          echo "✅ Все сборки и тесты успешно пройдены."
